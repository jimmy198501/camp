<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>報名管理後台｜韋宏B 年終露營</title>

<!-- 與報名表同一個 Firebase 專案 -->
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCESSWmDifF8FyVSzTU7YGMNv4UZkqsZuo",
  authDomain: "camp-weihong.firebaseapp.com",
  projectId: "camp-weihong",
  storageBucket: "camp-weihong.firebasestorage.app",
  messagingSenderId: "873391007452",
  appId: "1:873391007452:web:27ad428d50855a5563f619"
};
const EVENT_DATE = new Date(2025,11,19);
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#22303f;--soft:#5b6b7a;--line:#e3e8ee;
  --pine:#3a7a5e;--pine-d:#2c5f48;--amber:#e8a54b;--amber-d:#c9851f;--danger:#c0492f;
  --sky:#1b2a4a;--radius:14px;--shadow:0 6px 22px rgba(27,42,74,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{background:var(--sky);color:#fff;padding:16px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0}
header.top .who{font-size:13px;opacity:.85}
.btn{font:inherit;font-weight:700;border:1.5px solid transparent;border-radius:10px;padding:9px 15px;cursor:pointer;transition:.15s}
.btn.primary{background:var(--amber);color:#3a2c0e}.btn.primary:hover{background:var(--amber-d);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--soft)}
.btn.mini{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:#fff;border-color:#e6b3a8;color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.pine{background:var(--pine);color:#fff}.btn.pine:hover{background:var(--pine-d)}

/* login */
.login{max-width:380px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 22px}
.login h2{margin:0 0 4px}.login p{color:var(--soft);font-size:13.5px;margin:0 0 18px}
.login label{display:block;font-size:13.5px;font-weight:500;margin:12px 0 5px}
.login input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
.login input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,165,75,.18)}
.login .btn{width:100%;margin-top:18px}
.login .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:900;color:var(--pine-d)}
.stat .l{font-size:12.5px;color:var(--soft)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:16px}
.panel h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel h3 .tools{display:flex;gap:8px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:700;font-size:12.5px;white-space:nowrap}
tbody tr:hover{background:#fafbfc}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.full{background:#eef4ef;color:var(--pine-d)}
.tag.wish{background:#fdf1e3;color:var(--amber-d)}
.stockbar{height:6px;background:#eef0f2;border-radius:99px;overflow:hidden;margin-top:5px;min-width:90px}
.stockbar i{display:block;height:100%;background:var(--pine)}
.stockbar i.low{background:var(--amber)} .stockbar i.zero{background:var(--danger)}
.mini-people{font-size:12.5px;color:var(--soft);margin-top:4px}
.mini-people b{color:var(--ink)}
details summary{cursor:pointer;color:var(--pine-d);font-weight:500;font-size:12.5px}
details table{margin-top:8px;font-size:12.5px}
.scroll{overflow-x:auto}
.empty{color:var(--soft);text-align:center;padding:30px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--sky);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
.note{font-size:12.5px;color:var(--soft);margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:80;overflow:auto}
.modal.hidden{display:none}
.modalbox{background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modalbox h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:16px}
.modalbox .x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--soft)}
#editBody{padding:14px 18px;max-height:66vh;overflow:auto}
.ed-sec{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.ed-sec h4{margin:0 0 6px;font-size:14px}
.ed-l{display:block;font-size:12.5px;color:var(--soft);margin:8px 0 3px}
#editBody input,#editBody select,#editBody textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
#editBody input[type=radio]{width:auto;margin-right:4px}
#editBody .radio{display:inline-block;margin-right:16px;font-size:14px}
.ed-mate{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.ed-mate-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:2px}
.modalfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.gm{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13.5px}
.gm input{margin-top:3px;flex:none}
.gm.dim{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="loginView">
  <div class="login">
    <h2>報名管理後台</h2>
    <p>韋宏B 年終露營趣 · 管理者登入</p>
    <label>管理者 Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
    <label>密碼</label>
    <input type="password" id="loginPw" placeholder="密碼" autocomplete="current-password">
    <button class="btn primary" id="loginBtn">登入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 後台主畫面 -->
<div id="adminView" class="hidden">
  <header class="top">
    <div class="wrap">
      <h1>⛺️ 報名管理後台</h1>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="who" id="whoami"></span>
        <button class="btn ghost mini" id="logoutBtn">登出</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="panel">
      <h3>帳位庫存
        <span class="tools">
          <button class="btn ghost mini" id="recalcBtn" title="依實際「已滿4人」報名重新計算各帳已用數量">重算庫存</button>
        </span>
      </h3>
      <div class="scroll"><table id="stockTable"></table></div>
      <div class="note">「重算庫存」會依目前所有「已滿4人」的報名，重新算出每個帳型的已用數 — 刪除測試資料後可用它把數字校正回來。</div>
    </div>

    <div class="panel">
      <h3>併帳群組（未滿4人）
        <span class="tools">
          <button class="btn pine mini" id="newGroupBtn" onclick="openGroup(null)">＋ 新增併帳群組</button>
        </span>
      </h3>
      <div class="scroll"><table id="groupTable"></table></div>
      <div class="note">把數筆「未滿4人」的報名併成一頂帳：只佔 1 頂帳位，帳篷費依各筆佔床人數分攤，每筆總額＝分攤帳費＋自己的保險費。</div>
    </div>

    <div class="panel">
      <h3>報名清單（<span id="regCount">0</span>）
        <span class="tools">
          <button class="btn ghost mini" id="refreshBtn">重新整理</button>
          <button class="btn pine mini" id="exportBtn">匯出 Excel</button>
        </span>
      </h3>
      <div class="scroll"><table id="regTable"></table></div>
    </div>
  </div>
</div>

<div id="groupModal" class="modal hidden">
  <div class="modalbox">
    <h3><span id="groupTitle">新增併帳群組</span><button class="x" onclick="closeGroup()">&times;</button></h3>
    <div id="groupBody"></div>
    <div class="modalfoot">
      <button class="btn ghost" onclick="closeGroup()">取消</button>
      <button class="btn primary" id="saveGroupBtn" onclick="saveGroup()">儲存群組</button>
    </div>
  </div>
</div>

<div id="editModal" class="modal hidden">
  <div class="modalbox">
    <h3><span>編輯報名</span><button class="x" onclick="closeEdit()">&times;</button></h3>
    <div id="editBody"></div>
    <div class="modalfoot">
      <button class="btn ghost" onclick="closeEdit()">取消</button>
      <button class="btn primary" id="saveEditBtn" onclick="saveEdit()">儲存修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(); const db=firebase.firestore();

let REGS=[]; let TENTS_LIVE={}; let unsubR=null, unsubT=null, unsubG=null;

/* ── 登入 ── */
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function doLogin(){
  const em=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPw').value;
  const err=document.getElementById('loginErr'); err.textContent='';
  auth.signInWithEmailAndPassword(em,pw).catch(e=>{
    err.textContent = e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ? '帳號或密碼錯誤' : ('登入失敗：'+e.code);
  });
}
document.getElementById('logoutBtn').onclick=()=>auth.signOut();

auth.onAuthStateChanged(u=>{
  if(u){
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('adminView').classList.remove('hidden');
    document.getElementById('whoami').textContent=u.email;
    start();
  }else{
    document.getElementById('adminView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    if(unsubR)unsubR(); if(unsubT)unsubT(); if(unsubG)unsubG();
  }
});

/* ── 監聽資料 ── */
function start(){
  unsubT=db.collection('tents').onSnapshot(s=>{
    TENTS_LIVE={}; s.forEach(d=>TENTS_LIVE[d.id]=d.data()); renderStock();
  }, err=>toast('讀取帳位失敗：'+err.code));
  unsubR=db.collection('registrations').orderBy('createdAt','desc').onSnapshot(s=>{
    REGS=s.docs.map(d=>({_id:d.id,...d.data()})); renderAll();
  }, err=>{
    db.collection('registrations').onSnapshot(s2=>{ REGS=s2.docs.map(d=>({_id:d.id,...d.data()})); renderAll(); });
  });
  unsubG=db.collection('groups').onSnapshot(s=>{ GROUPS={}; s.forEach(d=>GROUPS[d.id]=d.data()); renderAll(); }, err=>console.error(err));
}
document.getElementById('refreshBtn').onclick=()=>{ if(auth.currentUser){ toast('已是即時更新'); } };

/* ── 計算 ── */
function under15(b){ if(!b)return false; const d=new Date(b); let a=EVENT_DATE.getFullYear()-d.getFullYear(); const m=EVENT_DATE.getMonth()-d.getMonth(); if(m<0||(m===0&&EVENT_DATE.getDate()<d.getDate()))a--; return a<15; }
function peopleOf(r){
  const c=r.contact||{}; const arr=[{role:'主報名', ...c, bed:'佔床'}];
  (r.mates||[]).forEach((m,i)=>arr.push({role:'同行'+(i+1), ...m}));
  return arr;
}

/* ── 費用計算 ── */
const TENT_FEE={
  mengguba:{price:3500,night:1750}, caixia:{price:4500,night:2250}, wenxin:{price:4500,night:2250},
  bft_a:{price:4000,night:2000}, bft_b:{price:4000,night:2000}, bft_c:{price:4000,night:2000}, bft_d:{price:4000,night:2000},
  ybb:{opts:{self:{price:2200,night:1100},host:{price:2700,night:1350}}},
  cd_a:{opts:{self:{price:1200,night:600},host:{price:2200,night:600}}},
  cd_b:{opts:{self:{price:1200,night:600},host:{price:2200,night:600}}},
  cd_c:{opts:{self:{price:1200,night:600},host:{price:2200,night:600}}}
};
function tentFeeOf(r){
  if(r.full!=='已滿'||!r.tent||!r.tent.id) return null;
  const f=TENT_FEE[r.tent.id]; if(!f) return null;
  let base,night;
  if(f.opts){ const o=f.opts[r.tent.opt]; if(!o) return null; base=o.price; night=o.night; }
  else { base=f.price; night=f.night; }
  return base + (r.nightRush==='是'?night:0);
}
function insFeeOf(r){
  const days=r.nightRush==='是'?2:1; let s=0;
  peopleOf(r).forEach(p=>{ s+= under15(p.birth)?21:30; });
  return s*days;
}
function feeOf(r){
  const g=groupOf(r);
  const nightRush = g? g.nightRush : r.nightRush;
  let tent=null, pending=false;
  if(g){ tent=memberShare(r,g); }
  else if(r.full==='已滿' && r.tent && r.tent.id){ tent=tentFeeOf(r); }
  else { pending=true; }
  const days = nightRush==='是'?2:1;
  let ins=0; peopleOf(r).forEach(p=>ins += under15(p.birth)?21:30); ins*=days;
  return { tent: pending?null:tent, ins:ins, total: pending?null:(tent+ins), pending:pending, grouped:!!g };
}
function money(n){ return '$'+Number(n).toLocaleString(); }

/* ── 統計卡 ── */
function renderAll(){
  document.getElementById('regCount').textContent=REGS.length;
  let people=0, kids=0, full=0, wish=0, paidCnt=0, dueKnown=0;
  REGS.forEach(r=>{ const ppl=peopleOf(r); people+=ppl.length; kids+=ppl.filter(p=>under15(p.birth)).length;
    if(r.full==='已滿')full++; else wish++;
    if(r.paid)paidCnt++;
    const f=feeOf(r); if(f.total!==null) dueKnown+=f.total;
  });
  const cards=[
    ['報名筆數',REGS.length],['總人數',people],
    ['已滿 / 未滿', full+' / '+wish],['未滿15歲',kids],
    ['已收 / 未收', paidCnt+' / '+(REGS.length-paidCnt)],
    ['應收合計（已定帳）', money(dueKnown)]
  ];
  document.getElementById('stats').innerHTML=cards.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  renderRegs();
  if(typeof renderGroups==='function') renderGroups();
}

/* ── 帳位庫存表 ── */
const TENT_ORDER=['mengguba','caixia','wenxin','bft_a','bft_b','bft_c','bft_d','ybb','cd_a','cd_b','cd_c'];
function renderStock(){
  const rows=TENT_ORDER.filter(id=>TENTS_LIVE[id]).map(id=>{
    const t=TENTS_LIVE[id]; const taken=t.taken||0, total=t.total||0, rem=total-taken;
    const pct=total?Math.round(taken/total*100):0;
    const cls=rem<=0?'zero':(rem<=2?'low':'');
    return `<tr><td><b>${t.name||id}</b></td>
      <td>${taken} / ${total}</td>
      <td>剩 ${rem}<div class="stockbar"><i class="${cls}" style="width:${pct}%"></i></div></td></tr>`;
  }).join('');
  document.getElementById('stockTable').innerHTML=
    `<thead><tr><th>帳型</th><th>已用 / 總數</th><th>剩餘</th></tr></thead><tbody>${rows||'<tr><td colspan=3 class=empty>尚無帳位資料</td></tr>'}</tbody>`;
}

/* ── 報名清單 ── */
function fmtTime(ts){
  try{ const d = ts && ts.toDate ? ts.toDate() : (ts?new Date(ts):null); if(!d)return '—';
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }catch(e){ return '—'; }
}
function tentText(r){
  const g=groupOf(r);
  if(g) return tentLabelG(g.tentId,g.tentOpt)+'（併帳）';
  if(r.full==='已滿') return (r.tent&&r.tent.label)||'—';
  const w=(r.wishes||[]).map((x,i)=>`${i+1}.${x.label||x.id}`).join('、');
  return w||'—';
}
function renderRegs(){
  if(!REGS.length){ document.getElementById('regTable').innerHTML='<tbody><tr><td class=empty>目前沒有報名資料</td></tr></tbody>'; return; }
  const rows=REGS.map(r=>{
    const c=r.contact||{}; const ppl=peopleOf(r);
    const detail=ppl.map(p=>`<tr><td>${p.role}</td><td>${esc(p.name)}</td><td>${esc(p.birth)}</td><td>${esc(p.id)}</td><td>${esc(p.diet||'')}</td><td>${under15(p.birth)?'未滿15':'—'}</td><td>${esc(p.guardian||'')}</td><td>${esc(p.bed||'佔床')}</td></tr>`).join('');
    const f=feeOf(r);
    const feeCell = f.pending
      ? `保險 ${money(f.ins)}<div class="note">帳篷待定</div>`
      : `<b>${money(f.total)}</b><div class="note">帳 ${money(f.tent)}＋保 ${money(f.ins)}</div>`;
    const paidCell = r.paid
      ? `<button class="btn pine mini" onclick="togglePaid('${r._id}')">已收 ✓</button><div class="note">${esc(r.paidBy||'')}${r.paidAt?'<br>'+fmtTime(r.paidAt):''}</div>`
      : `<button class="btn ghost mini" onclick="togglePaid('${r._id}')">未收</button>`;
    return `<tr>
      <td>${fmtTime(r.createdAt)}</td>
      <td><b>${esc(c.name)}</b><div class="mini-people">${esc(c.phone||'')}<br>${esc(c.email||'')}</div></td>
      <td>${ppl.length} 人${r.nightRush==='是'?'<br><span class="tag wish">夜衝</span>':''}</td>
      <td>${r.full==='已滿'?'<span class="tag full">已滿</span>':'<span class="tag wish">未滿</span>'}<br>${esc(tentText(r))}</td>
      <td>${feeCell}</td>
      <td><details><summary>展開 ${ppl.length} 人保險資料</summary>
        <table><thead><tr><th>身份</th><th>姓名</th><th>生日</th><th>身分證</th><th>飲食</th><th>未滿15</th><th>監護人</th><th>床位</th></tr></thead><tbody>${detail}</tbody></table>
        ${r.mergeNote?`<div class="note">併帳備註：${esc(r.mergeNote)}</div>`:''}
      </details></td>
      <td>${paidCell}</td>
      <td><button class="btn ghost mini" onclick="openEdit('${r._id}')">編輯</button> <button class="btn danger mini" onclick="delReg('${r._id}')">刪除</button></td>
    </tr>`;
  }).join('');
  document.getElementById('regTable').innerHTML=
    `<thead><tr><th>時間</th><th>主報名人</th><th>人數</th><th>帳篷</th><th>費用</th><th>參加人員</th><th>收費</th><th></th></tr></thead><tbody>${rows}</tbody>`;
}

/* ── 收費狀態切換 ── */
async function togglePaid(id){
  const r=REGS.find(x=>x._id===id); if(!r) return;
  try{
    if(r.paid){
      await db.collection('registrations').doc(id).update({paid:false, paidBy:'', paidAt:null});
    }else{
      await db.collection('registrations').doc(id).update({paid:true, paidBy:(auth.currentUser&&auth.currentUser.email)||'', paidAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
  }catch(e){ console.error(e); toast('更新收費狀態失敗：'+(e.code||e.message)); }
}

/* ── 刪除單筆（已滿的同時把該帳位 -1） ── */
async function delReg(id){
  const r=REGS.find(x=>x._id===id); if(!r)return;
  if(!confirm(`確定刪除「${(r.contact&&r.contact.name)||'此筆'}」的報名？`+(r.full==='已滿'?'\n（會把該帳位釋放 -1）':''))) return;
  try{
    if(r.groupId && GROUPS[r.groupId]){
      const g=GROUPS[r.groupId];
      await db.collection('groups').doc(r.groupId).update({members:(g.members||[]).filter(x=>x!==id)});
      await db.collection('registrations').doc(id).delete();
      toast('已刪除'); return;
    }
    if(r.full==='已滿' && r.tent && r.tent.id){
      const tref=db.collection('tents').doc(r.tent.id);
      await db.runTransaction(async tx=>{
        const s=await tx.get(tref); const cur=s.exists?(s.data().taken||0):0;
        tx.update(tref,{taken:Math.max(0,cur-1)});
        tx.delete(db.collection('registrations').doc(id));
      });
    }else{
      await db.collection('registrations').doc(id).delete();
    }
    toast('已刪除');
  }catch(e){ console.error(e); toast('刪除失敗：'+(e.code||e.message)); }
}

/* ── 重算庫存 ── */
document.getElementById('recalcBtn').onclick=async ()=>{
  if(!confirm('依目前所有「已滿4人」報名，重新計算每個帳型的已用數量？')) return;
  const count={};
  REGS.forEach(r=>{ if(r.full==='已滿' && r.tent && r.tent.id){ count[r.tent.id]=(count[r.tent.id]||0)+1; } });
  Object.values(GROUPS).forEach(g=>{ if(g.tentId){ count[g.tentId]=(count[g.tentId]||0)+1; } });
  try{
    const batch=db.batch();
    TENT_ORDER.forEach(id=>{ if(TENTS_LIVE[id]) batch.update(db.collection('tents').doc(id),{taken:count[id]||0}); });
    await batch.commit(); toast('庫存已重算校正');
  }catch(e){ console.error(e); toast('重算失敗：'+(e.code||e.message)); }
};

/* ═══════════ 併帳群組 ═══════════ */
let GROUPS={};                 // groupId -> {tentId,tentOpt,nightRush,members:[regId...]}
function bedsOf(r){ return peopleOf(r).filter(p=>p.bed!=='不佔床').length; }
function groupOf(r){ return r.groupId && GROUPS[r.groupId] ? GROUPS[r.groupId] : null; }
function groupTentFee(g){
  const f=TENT_FEE[g.tentId]; if(!f) return 0;
  let base,night;
  if(f.opts){ const o=f.opts[g.tentOpt]; base=o?o.price:0; night=o?o.night:0; }
  else { base=f.price; night=f.night; }
  return base + (g.nightRush==='是'?night:0);
}
function groupMembers(g){ return (g.members||[]).map(id=>REGS.find(x=>x._id===id)).filter(Boolean); }
function memberShare(r,g){
  const mem=groupMembers(g);
  const beds=mem.map(m=>bedsOf(m));
  const totalBeds=beds.reduce((a,b)=>a+b,0) || mem.length || 1;
  const fee=groupTentFee(g);
  const shares=mem.map((m,i)=>Math.floor(fee*(bedsOf(m))/totalBeds));
  let rem=fee-shares.reduce((a,b)=>a+b,0);
  for(let i=0;i<rem;i++){ shares[i%shares.length]++; }
  const idx=mem.findIndex(m=>m._id===r._id);
  return idx>=0?shares[idx]:0;
}
function tentLabelG(id,opt){ const nm=TENT_NAME[id]||id; if(TENT_OPTS[id]&&opt){const o=TENT_OPTS[id].find(x=>x[0]===opt);return nm+'・'+(o?o[1]:'');} return nm; }

/* 群組清單 */
function renderGroups(){
  const gArr=Object.entries(GROUPS);
  if(!gArr.length){ document.getElementById('groupTable').innerHTML='<tbody><tr><td class=empty>尚無併帳群組</td></tr></tbody>'; return; }
  const rows=gArr.map(([gid,g])=>{
    const mem=groupMembers(g);
    const beds=mem.reduce((s,m)=>s+bedsOf(m),0);
    const memList=mem.map(m=>{ const nm=(m.contact&&m.contact.name)||'?'; return `${esc(nm)}（${peopleOf(m).length}人/佔床${bedsOf(m)}・分攤 ${money(memberShare(m,g))}）`; }).join('<br>');
    return `<tr>
      <td><b>${esc(tentLabelG(g.tentId,g.tentOpt))}</b>${g.nightRush==='是'?'<br><span class="tag wish">夜衝</span>':''}<div class="note">帳費 ${money(groupTentFee(g))}</div></td>
      <td>${mem.length} 筆・佔床 ${beds} 人</td>
      <td>${memList||'—'}</td>
      <td><button class="btn ghost mini" onclick="openGroup('${gid}')">編輯</button> <button class="btn danger mini" onclick="delGroup('${gid}')">解散</button></td>
    </tr>`;
  }).join('');
  document.getElementById('groupTable').innerHTML=
    `<thead><tr><th>帳篷</th><th>人數</th><th>成員（分攤）</th><th></th></tr></thead><tbody>${rows}</tbody>`;
}

async function saveGroup(){

  if(!tentId){ toast('請選擇帳篷'); return; }
  if(TENT_OPTS[tentId] && !eg('g_opt')){ toast('請選自搭／營主搭'); return; }

  const old = GID? GROUPS[GID] : null;
  const oldTentId = old? old.tentId : null;
  const oldMembers = old? (old.members||[]) : [];
  const newTentId = tentId;
  // 佔用一頂帳（新群或換帳時）
  const needNewTent = (oldTentId!==newTentId);
  if(needNewTent && remain(newTentId)<=0){ if(!confirm('此帳目前已額滿，仍要指定給本群？（會超額）')) return; }
  const groupData={ tentId:newTentId, tentOpt: TENT_OPTS[newTentId]?eg('g_opt'):'', nightRush, members:picked };
  const added=picked.filter(id=>!oldMembers.includes(id));
  const removed=oldMembers.filter(id=>!picked.includes(id));
  const btn=document.getElementById('saveGroupBtn'); btn.disabled=true;
  try{
    await db.runTransaction(async tx=>{
      let oldRef,newRef,oldSnap,newSnap;
      if(needNewTent && oldTentId){ oldRef=db.collection('tents').doc(oldTentId); oldSnap=await tx.get(oldRef); }
      if(needNewTent && newTentId){ newRef=db.collection('tents').doc(newTentId); newSnap=await tx.get(newRef); }
      if(needNewTent && oldTentId){ const c=((oldSnap.data()||{}).taken)||0; tx.update(oldRef,{taken:Math.max(0,c-1)}); }
      if(needNewTent && newTentId){ const c=((newSnap.data()||{}).taken)||0; tx.update(newRef,{taken:c+1}); }
      const gref = GID? db.collection('groups').doc(GID) : db.collection('groups').doc();
      tx.set(gref, groupData);
      added.forEach(id=>tx.update(db.collection('registrations').doc(id),{groupId:gref.id}));
      removed.forEach(id=>tx.update(db.collection('registrations').doc(id),{groupId:firebase.firestore.FieldValue.delete()}));
    });
    closeGroup(); toast('已儲存併帳群組');
  }catch(e){ console.error(e); toast('儲存失敗：'+(e.code||e.message)); btn.disabled=false; }
}
async function delGroup(gid){
  const g=GROUPS[gid]; if(!g)return;
  if(!confirm('解散此併帳群組？（會釋放該帳位 +1，成員回到未指定狀態）')) return;
  try{
    await db.runTransaction(async tx=>{
      const tref=db.collection('tents').doc(g.tentId);
      const s=await tx.get(tref); const c=s.exists?(s.data().taken||0):0;
      tx.update(tref,{taken:Math.max(0,c-1)});
      (g.members||[]).forEach(id=>tx.update(db.collection('registrations').doc(id),{groupId:firebase.firestore.FieldValue.delete()}));
      tx.delete(db.collection('groups').doc(gid));
    });
    toast('已解散群組');
  }catch(e){ console.error(e); toast('解散失敗：'+(e.code||e.message)); }
}

function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
</script>
