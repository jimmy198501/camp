     建議安全規則（Firebase 主控台 → Firestore → 規則）：
       rules_version = '2';
       service cloud.firestore {
         match /databases/{db}/documents {
           match /tents/{id} {
             allow read: if true;
             // 任何人可報名扣位，但只能「+1 且不超過總數」，防篡改
             allow update: if request.resource.data.taken == resource.data.taken + 1
                           && request.resource.data.taken <= resource.data.total;
             allow create, delete: if false;   // 帳位由你在主控台建立
           }
           match /registrations/{id} {
             allow create: if true;            // 任何人可送出報名
             allow read, update, delete: if false; // 個資只有你（之後管理頁登入）能讀
           }
         }
       }

<style>
:root{
  --sky-1:#1b2a4a; --sky-2:#2c3f66; --sky-3:#3f5a8a;
  --paper:#fbf7ef; --card:#ffffff; --ink:#22303f; --ink-soft:#5b6b7a;
  --line:#e7ddcd; --amber:#e8a54b; --amber-d:#c9851f;
  --pine:#3a7a5e; --pine-d:#2c5f48;
  --danger:#c0492f; --ok:#2c8a5a;
  --radius:16px; --shadow:0 10px 30px rgba(27,42,74,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC",system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  line-height:1.7; -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 64px}

/* ── Hero ── */
.hero{
  position:relative; overflow:hidden; color:#fff; text-align:center;
  background:radial-gradient(120% 90% at 50% -10%, #48628f 0%, var(--sky-2) 40%, var(--sky-1) 100%);
  padding:44px 20px 34px;
}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.hero .stars i{position:absolute;background:#fff;border-radius:50%;opacity:.85}
.hero h1{
  font-family:"Noto Serif TC",serif; font-weight:900; margin:.1em 0 .3em;

  position:relative;
}
.hero .moon{font-size:30px;display:block;margin-bottom:6px}
.hero .meta{position:relative;font-size:15px;opacity:.95;margin:4px 0}
.hero .meta b{color:var(--amber);font-weight:700}
.hero .place{position:relative;font-size:13.5px;opacity:.8;margin-top:8px}

/* ── Progress ── */
.progress{display:flex;gap:6px;max-width:640px;margin:18px auto 4px;padding:0 16px}
.progress span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.progress span.on{background:var(--amber)}
.progress span.done{background:var(--pine)}

/* ── Card / step ── */
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 18px;margin-top:16px}
.step h2{font-family:"Noto Serif TC",serif;font-size:20px;margin:0 0 4px}
.step .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px}
.stepno{color:var(--pine);font-weight:700;font-size:13px;letter-spacing:.5px}

/* ── Fields ── */
label.f{display:block;margin:14px 0 6px;font-weight:500;font-size:14.5px}
label.f .req{color:var(--danger)}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,165,75,.18)}
textarea{min-height:74px;resize:vertical}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.err{font-size:12.5px;color:var(--danger);margin-top:5px;display:none}
.err.show{display:block}
input.bad,select.bad{border-color:var(--danger)}

/* ── Radios / choice ── */
.choices{display:grid;gap:10px;margin-top:6px}
.choice{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;transition:.15s}
.choice:hover{border-color:#d9cbb2}
.choice input{margin-top:3px;accent-color:var(--pine);width:18px;height:18px;flex:none}
.choice.sel{border-color:var(--pine);background:#f4faf6}
.choice .t{font-weight:500}
.choice .d{font-size:12.5px;color:var(--ink-soft)}

/* ── Tent grid ── */
.tents{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:8px}
@media(max-width:460px){.tents{grid-template-columns:1fr}}
.tent{border:1.5px solid var(--line);border-radius:13px;padding:13px;background:#fff;
  cursor:pointer;transition:.15s;position:relative}
.tent:hover{border-color:#d9cbb2}
.tent.sel{border-color:var(--pine);background:#f4faf6;box-shadow:0 0 0 3px rgba(58,122,94,.12)}
.tent.full{opacity:.5;cursor:not-allowed;background:#f6f3ee}
.tent .nm{font-weight:700;font-size:15px}
.tent .pr{color:var(--amber-d);font-weight:700;font-size:14px;margin-top:2px}
.tent .nt{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.tent .stock{display:inline-block;font-size:11.5px;font-weight:700;margin-top:8px;
  padding:2px 9px;border-radius:99px;background:#eef4ef;color:var(--pine)}
.tent .stock.low{background:#fdf1e3;color:var(--amber-d)}
.tent .stock.zero{background:#f7e7e3;color:var(--danger)}
.tent .tphoto{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px;margin-bottom:9px;background:#eef0f2;display:block}
.tent.full .tphoto{filter:grayscale(.55) brightness(.97)}
.wishpic{width:100%;max-width:220px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-top:8px;display:none}
.wishpic.show{display:block}
.tent .sub{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:none;gap:8px}
.tent.sel .sub{display:grid}
.subopt{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 9px;border:1.3px solid var(--line);border-radius:9px}
.subopt.sel{border-color:var(--amber);background:#fdf7ee}
.subopt input{accent-color:var(--amber-d);flex:none}

/* ── Roommate block ── */
.mate{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px;background:#fdfcfa}
.mate h3{margin:0 0 2px;font-size:15px;font-family:"Noto Serif TC",serif}
.mate .rm{float:right;font-size:12.5px;color:var(--danger);cursor:pointer;background:none;border:none}
.addmate{width:100%;border:1.5px dashed var(--pine);color:var(--pine-d);background:#f4faf6;

.bed{display:flex;gap:8px;margin-top:8px}
.bed label{flex:1;text-align:center;border:1.3px solid var(--line);border-radius:9px;padding:8px;font-size:13px;cursor:pointer}
.bed input{display:none}
.bed label.sel{border-color:var(--pine);background:#f4faf6;font-weight:700;color:var(--pine-d)}

/* ── Insurance notice ── */

.notice ul{margin:8px 0 0;padding-left:18px}
.notice li{margin:4px 0}
.ack{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.ack input{margin-top:3px;width:19px;height:19px;accent-color:var(--pine);flex:none}

/* ── Nav buttons ── */
.nav{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:12px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
.btn.primary{background:var(--amber);color:#3a2c0e}
.btn.primary:hover{background:var(--amber-d);color:#fff}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-soft);flex:0 0 auto;min-width:96px}
.btn.ghost:hover{border-color:var(--ink-soft)}

/* ── Summary / success ── */
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumrow:last-child{border-bottom:none}
.sumrow .k{color:var(--ink-soft)}
.sumrow .v{font-weight:500;text-align:right}
.total{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:2px solid var(--pine);font-size:17px;font-weight:700}
.total .amt{color:var(--amber-d)}
.success{text-align:center;padding:30px 16px}
.success .big{font-size:52px}
.success h2{font-family:"Noto Serif TC",serif;font-size:24px;margin:10px 0 6px}
.code{display:inline-block;font-weight:900;letter-spacing:1px;background:#f4faf6;color:var(--pine-d);
  border:1.5px solid #cfe6d8;border-radius:10px;padding:8px 16px;margin:10px 0;font-size:18px}

.mode-tag{text-align:center;font-size:12px;color:var(--ink-soft);margin:14px 0 0}
.mode-tag b{color:var(--amber-d)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--danger);color:#fff;
  padding:12px 18px;border-radius:11px;font-size:14px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

/* ═══════════ 台灣身分證檢查（軟性：不符只提醒不擋，含居留證彈性） ═══════════ */
function idFormatOk(v){ return /^[A-Za-z][0-9]{9}$/.test((v||'').trim()); }
function twidLooksValid(id){
  id=(id||'').toUpperCase().trim();
  if(!/^[A-Z][12][0-9]{8}$/.test(id)) return null; // 非標準國民身分證格式 → 不判斷
  const map={A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,
             N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33};
  const n=map[id[0]]; let sum=Math.floor(n/10)+(n%10)*9;
  const w=[8,7,6,5,4,3,2,1];
  for(let i=0;i<8;i++) sum+=parseInt(id[i+1])*w[i];
  sum+=parseInt(id[9]);
  return sum%10===0;
}
function isUnder15(birthStr){
  if(!birthStr) return false;
  const b=new Date(birthStr);
  let age=EVENT_DATE.getFullYear()-b.getFullYear();
  const m=EVENT_DATE.getMonth()-b.getMonth();
  if(m<0||(m===0&&EVENT_DATE.getDate()<b.getDate())) age--;
  return age<15;
}

/* ═══════════ 步驟流程 ═══════════ */
// 動態步驟序列（依「是否已滿4人」切換第5步）
const STEP_INTRO=0, STEP_FULL=1, STEP_TENT=2, STEP_WISH=2, STEP_NIGHT=3, STEP_CONTACT=4, STEP_MATES=5, STEP_INS=6, STEP_REVIEW=7, STEP_DONE=8;
let currentStep=0;
function steps(){ return ['說明','人數','選帳','夜衝','聯絡人','同行','保險','確認']; }

function setProg(){
  const names=steps(); const p=document.getElementById('prog'); p.innerHTML='';
  const active=Math.min(currentStep,names.length-1);
  names.forEach((_,i)=>{ const s=document.createElement('span');
    s.className = i<active?'done':(i===active?'on':''); p.appendChild(s); });
  document.getElementById('prog').style.display = (currentStep===STEP_DONE)?'none':'flex';
}

/* ═══════════ 各步驟渲染 ═══════════ */
const app=()=>document.getElementById('app');

function render(){
  setProg(); window.scrollTo({top:0,behavior:'smooth'});
  const fns=[rIntro,rFull,rTent,rNight,rContact,rMates,rIns,rReview,rDone];
  // 第5步依 full 決定 選帳 或 志願
  if(currentStep===2){ (state.full==='已滿'?rTent:rWish)(); return; }
  fns[currentStep]();
}

function nav(backTo,nextFn,nextLabel){
  const n=document.createElement('div'); n.className='nav';
  if(backTo!==null){ const b=document.createElement('button'); b.className='btn ghost'; b.textContent='返回';
    b.onclick=()=>{ currentStep=backTo; render(); }; n.appendChild(b); }
  const f=document.createElement('button'); f.className='btn primary'; f.id='nextBtn'; f.textContent=nextLabel||'繼續';
  f.onclick=nextFn; n.appendChild(f);
  app().appendChild(n);
}

  const showGuardian = isUnder15(obj.birth);
  return `
    <label class="f">姓名 <span class="req">*</span></label>
    <input type="text" id="${prefix}_name" value="${esc(obj.name)}" placeholder="真實姓名（保險用）">
    <div class="err" id="${prefix}_name_e">請填寫姓名</div>
    ${opts.email?`
    <label class="f">電子郵件 <span class="req">*</span></label>
    <input type="email" id="${prefix}_email" value="${esc(obj.email||'')}" placeholder="you@example.com">
    <div class="err" id="${prefix}_email_e">請填寫正確的 Email</div>`:''}
    ${opts.phone?`
    <label class="f">聯絡電話 <span class="req">*</span></label>
    <input type="tel" id="${prefix}_phone" value="${esc(obj.phone||'')}" placeholder="09xxxxxxxx">
    <div class="err" id="${prefix}_phone_e">請填寫聯絡電話</div>`:''}
    <label class="f">出生年月日 <span class="req">*</span></label>
    <input type="date" id="${prefix}_birth" value="${esc(obj.birth)}" onchange="onBirth('${prefix}')">
    <div class="err" id="${prefix}_birth_e">請選擇生日</div>
    <label class="f">身分證字號 <span class="req">*</span></label>
    <input type="text" id="${prefix}_id" value="${esc(obj.id)}" placeholder="A123456789" maxlength="10"
       oninput="this.value=this.value.toUpperCase()">
    <div class="err" id="${prefix}_id_e">請填寫身分證／居留證號</div>
    <div class="hint" id="${prefix}_id_warn"></div>
    <label class="f">飲食習慣 <span class="req">*</span></label>
    <select id="${prefix}_diet">
      <option${obj.diet==='葷食'?' selected':''}>葷食</option>
      <option${obj.diet==='素食'?' selected':''}>素食</option>
    </select>
    ${opts.bed?`
    <label class="f">床位</label>
    <div class="bed" id="${prefix}_bed">
      <label class="${obj.bed!=='不佔床'?'sel':''}"><input type="radio" name="${prefix}_bed" value="佔床" ${obj.bed!=='不佔床'?'checked':''} onchange="onBed('${prefix}')">佔床</label>
      <label class="${obj.bed==='不佔床'?'sel':''}"><input type="radio" name="${prefix}_bed" value="不佔床" ${obj.bed==='不佔床'?'checked':''} onchange="onBed('${prefix}')">不佔床（小孩免費）</label>
    </div>`:''}
    <div id="${prefix}_guard" class="${showGuardian?'':'hidden'}">
      <label class="f">法定代理人／監護人姓名 <span class="req">*</span><span class="hint" style="font-weight:400">（未滿 15 歲須填）</span></label>
      <input type="text" id="${prefix}_guardian" value="${esc(obj.guardian||'')}" placeholder="監護人姓名">
      <div class="err" id="${prefix}_guardian_e">未滿 15 歲須填寫監護人</div>
    </div>`;
}

function onBirth(prefix){
  const v=document.getElementById(prefix+'_birth').value;
  const g=document.getElementById(prefix+'_guard');
  if(g) g.classList.toggle('hidden', !isUnder15(v));
}
function onBed(prefix){
  const box=document.getElementById(prefix+'_bed'); if(!box)return;
  box.querySelectorAll('label').forEach(l=>{ const inp=l.querySelector('input'); l.classList.toggle('sel', !!(inp&&inp.checked)); });
}

  const c=state.contact;

  c.birth=val('c_birth'); c.id=val('c_id'); c.diet=val('c_diet'); c.guardian=val('c_guardian');
  let ok=true;
  ok=req('c_name',!!c.name)&&ok;
  ok=req('c_email',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email))&&ok;
  ok=req('c_phone',!!c.phone)&&ok;
  ok=req('c_birth',!!c.birth)&&ok;
  { const e=document.getElementById('c_id_e'); if(e) e.textContent = c.id? '身分證格式須為 1 碼英文字母 ＋ 9 碼數字（共 10 碼）' : '請填寫身分證字號'; }

function rMates(){

  app().innerHTML=html;
  drawMates();
  nav(STEP_CONTACT,saveMates,'繼續');
}
function drawMates(){
  const list=document.getElementById('mateList'); list.innerHTML='';
  state.mates.forEach((m,i)=>{
    const d=document.createElement('div'); d.className='mate';
    d.innerHTML=`<button class="rm" onclick="delMate(${i})">移除</button>
      <h3>同行者 ${i+1}</h3>${personFields('m'+i,m,{phone:true,bed:true})}`;
    list.appendChild(d);
    bindIdWarn('m'+i);
  });
}
function addMate(){ if(state.mates.length>=4)return; captureMates(); state.mates.push({name:'',phone:'',birth:'',id:'',diet:'葷食',bed:'佔床',guardian:''}); rMates(); }
function delMate(i){ captureMates(); state.mates.splice(i,1); rMates(); }
function captureMates(){
  state.mates.forEach((m,i)=>{
    m.name=val('m'+i+'_name'); m.phone=val('m'+i+'_phone'); m.birth=val('m'+i+'_birth');
    m.id=val('m'+i+'_id'); m.diet=val('m'+i+'_diet'); m.guardian=val('m'+i+'_guardian');
    const bed=document.querySelector(`input[name=m${i}_bed]:checked`); if(bed)m.bed=bed.value;
  });
}
function saveMates(){
  captureMates();
  let ok=true;
  state.mates.forEach((m,i)=>{
    ok=req('m'+i+'_name',!!m.name)&&ok;
    ok=req('m'+i+'_birth',!!m.birth)&&ok;
    { const e=document.getElementById('m'+i+'_id_e'); if(e) e.textContent = m.id? '身分證格式須為 1 碼英文字母 ＋ 9 碼數字（共 10 碼）' : '請填寫身分證字號'; }
    ok=req('m'+i+'_id',idFormatOk(m.id))&&ok;
    if(isUnder15(m.birth)) ok=req('m'+i+'_guardian',!!m.guardian)&&ok;
  });
  if(!ok){ toast('同行者資料未填完整'); return; }
  currentStep=STEP_INS; render();
}

/* ── 選帳（已滿4人）── */
function tentCard(t,selId,onPick,idPrefix){
  const rem=remaining(t.id);
  const sel = selId===t.id;
  const stockCls = rem<=0?'zero':(rem<=2?'low':'');
  const stockTxt = rem<=0?'已額滿':`剩 ${rem} 帳`;
  const priceLine = t.options
     ? t.options.map(o=>`${o.label.split('（')[0]} $${o.price}`).join('　')
     : `$${t.price} / 4人`;
  let sub='';
  if(t.options){
    sub=`<div class="sub">${t.options.map(o=>{
      const chosen = sel && state.tent.opt===o.k;
      const nrTxt = state.nightRush==='是'?`（夜衝 +$${o.night}）`:'';
      return `<label class="subopt ${chosen?'sel':''}">
        <input type="radio" name="${idPrefix}_opt_${t.id}" value="${o.k}" ${chosen?'checked':''}
         onclick="event.stopPropagation();${onPick.name?'':''}">${o.label} $${o.price}${nrTxt}</label>`;
    }).join('')}</div>`;
  }
  return `<div class="tent ${sel?'sel':''} ${rem<=0?'full':''}" data-id="${t.id}">
     <img class="tphoto" src="${PHOTO[t.id]||''}" alt="${t.nm}" loading="lazy">
     <div class="nm">${t.nm}</div>
     <div class="pr">${priceLine}</div>
     <div class="nt">${t.nt||''}${state.nightRush==='是'&&!t.options?`　夜衝 +$${t.night}`:''}</div>
     <div class="stock ${stockCls}">${stockTxt}</div>
     ${sub}
   </div>`;
}

function rTent(){
  app().innerHTML=`
   <div class="step">
     <span class="stepno">步驟 2 / 6　（已滿 4 人・選帳）</span>
     <h2>選擇帳篷</h2>
     <p class="sub">數量有限、額滿為止。草地與營本部請再選自搭／營主搭。</p>
     <div class="tents" id="tentGrid"></div>
   </div>`;
  renderStock();
  nav(STEP_FULL,saveTent);
}
function renderStock(){
  const grid=document.getElementById('tentGrid'); if(!grid)return;
  grid.innerHTML=TENTS.map(t=>tentCard(t,state.tent.id,{name:''},'t')).join('');
  grid.querySelectorAll('.tent').forEach(el=>{
    const id=el.dataset.id;
    if(remaining(id)<=0) return;
    el.onclick=()=>{ state.tent={id, opt: TENT[id].options?state.tent.opt:null}; renderStock(); };
  });
  grid.querySelectorAll('.subopt input').forEach(inp=>{
    inp.onclick=e=>{ e.stopPropagation();
      const card=inp.closest('.tent'); state.tent={id:card.dataset.id, opt:inp.value}; renderStock(); };
  });
}
function saveTent(){
  if(!state.tent.id){ toast('請選擇帳篷'); return; }
  if(remaining(state.tent.id)<=0){ toast('此帳已額滿，請改選其他帳'); renderStock(); return; }
  if(TENT[state.tent.id].options && !state.tent.opt){ toast('請選擇自搭帳或營主搭帳'); return; }
  currentStep=STEP_NIGHT; render();
}

/* ── 志願（未滿4人）── */
function rWish(){
  const optHtml=(sel,name)=>TENTS.map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${t.nm}${t.options?'':` $${t.price}`}</option>`).join('');
  let blocks='';
  for(let i=0;i<3;i++){
    const w=state.wishes[i]; const t=w.id?TENT[w.id]:null;
    blocks+=`
     <label class="f">第 ${['一','二','三'][i]} 志願 ${i===0?'<span class="req">*</span>':''}</label>
     <select id="w${i}_id" onchange="onWish(${i})">
       <option value="">— 請選擇 —</option>${optHtml(w.id)}
     </select>
     <div id="w${i}_opt" class="${t&&t.options?'':'hidden'}" style="margin-top:8px">
       <select id="w${i}_opt_sel">
         <option value="">自搭／營主搭…</option>
         ${t&&t.options?t.options.map(o=>`<option value="${o.k}" ${w.opt===o.k?'selected':''}>${o.label} $${o.price}</option>`).join(''):''}
       </select>
     </div>
     <img id="w${i}_pic" class="wishpic ${w.id?'show':''}" src="${w.id?PHOTO[w.id]:''}" alt="">`;
  }
  app().innerHTML=`
   <div class="step">
     <span class="stepno">步驟 2 / 6　（未滿 4 人・填志願）</span>
     <h2>帳篷志願</h2>
     <p class="sub">主辦會依志願協助併帳／排帳，最終帳位以主辦回覆為準。</p>
     ${blocks}
     <label class="f">併帳需求／備註</label>
     <textarea id="mergeNote" placeholder="例如：希望和某某家庭同區、可接受男女分帳、只有 2 位…">${esc(state.mergeNote)}</textarea>
   </div>`;
  nav(STEP_FULL,saveWish);
}
function onWish(i){
  const id=val('w'+i+'_id'); state.wishes[i].id=id; state.wishes[i].opt=null;
  const box=document.getElementById('w'+i+'_opt');
  const t=id?TENT[id]:null;
  box.classList.toggle('hidden', !(t&&t.options));
  if(t&&t.options) box.innerHTML=`<select id="w${i}_opt_sel"><option value="">自搭／營主搭…</option>${t.options.map(o=>`<option value="${o.k}">${o.label} $${o.price}</option>`).join('')}</select>`;
  const pic=document.getElementById('w'+i+'_pic');
  if(pic){ if(id){pic.src=PHOTO[id]||'';pic.classList.add('show');} else {pic.classList.remove('show');} }
}
function saveWish(){
  for(let i=0;i<3;i++){ state.wishes[i].id=val('w'+i+'_id')||null; const os=document.getElementById('w'+i+'_opt_sel'); state.wishes[i].opt=os?os.value||null:null; }
  state.mergeNote=val('mergeNote');
  if(!state.wishes[0].id){ toast('請至少填第一志願'); return; }
  const t0=TENT[state.wishes[0].id];
  if(t0.options && !state.wishes[0].opt){ toast('第一志願請選自搭／營主搭'); return; }
  currentStep=STEP_NIGHT; render();
}

/* ── 確認與送出 ── */
function priceOf(tentSel){
  const t=TENT[tentSel.id]; if(!t)return null;
  if(t.options){ const o=t.options.find(x=>x.k===tentSel.opt); if(!o)return null;
    return o.price + (state.nightRush==='是'?o.night:0); }
  return t.price + (state.nightRush==='是'?t.night:0);
}
function tentLabel(sel){
  const t=TENT[sel.id]; if(!t)return '—';
  if(t.options){ const o=t.options.find(x=>x.k===sel.opt); return `${t.nm}・${o?o.label.split('（')[0]:'?'}`; }
  return t.nm;
}
function rReview(){
  const c=state.contact;
  const people=[{...c,bed:'佔床'},...state.mates];
  const adults=people.filter(p=>!isUnder15(p.birth)&&p.bed!=='不佔床').length;
  const kids=people.filter(p=>isUnder15(p.birth)).length;
  const insDays=state.nightRush==='是'?2:1;
  const insurance=(people.filter(p=>!isUnder15(p.birth)).length*30 + kids*21)*insDays;

  let tentRow='', tentAmt=0;
  if(state.full==='已滿'){
    tentAmt=priceOf(state.tent)||0;
    tentRow=`<div class="sumrow"><span class="k">帳篷</span><span class="v">${tentLabel(state.tent)} ・ $${tentAmt}${state.nightRush==='是'?'（含夜衝）':''}</span></div>`;
  }else{
    const w=state.wishes.filter(x=>x.id).map((x,i)=>`${i+1}.${tentLabel(x)}`).join('　');
    tentRow=`<div class="sumrow"><span class="k">帳篷志願</span><span class="v">${w||'—'}</span></div>
      <div class="sumrow"><span class="k">併帳備註</span><span class="v">${esc(state.mergeNote)||'—'}</span></div>`;
  }
  const est = (state.full==='已滿')? (tentAmt+insurance) : null;

  app().innerHTML=`
   <div class="step">
     <span class="stepno">確認</span>
     <h2>確認報名內容</h2>
     <p class="sub">送出前再看一次。帳位在按下送出時才會保留。</p>
     <div class="sumrow"><span class="k">主要聯絡人</span><span class="v">${esc(c.name)}（${esc(c.phone)}）</span></div>
     <div class="sumrow"><span class="k">Email</span><span class="v">${esc(c.email)}</span></div>
     <div class="sumrow"><span class="k">同行人數</span><span class="v">主聯 1 位＋同行 ${state.mates.length} 位</span></div>
     <div class="sumrow"><span class="k">夜衝</span><span class="v">${state.nightRush}</span></div>
     <div class="sumrow"><span class="k">帳位</span><span class="v">${state.full} 4 人</span></div>
     ${tentRow}
     <div class="sumrow"><span class="k">保險費（估）</span><span class="v">$${insurance}（${insDays} 天）</span></div>
     ${est!==null?`<div class="total"><span>預估合計</span><span class="amt">$${est}</span></div>
       <p class="hint">＊帳費以整帳計；此為帳費＋保險估算，實際以主辦對帳為準。</p>`:
       `<p class="hint">＊未滿 4 人由主辦排帳後再結算費用。</p>`}
   </div>`;
  nav(STEP_INS,submit,'送出報名');
}

/* ── 送出：正式版用 Firestore 交易鎖帳位；示範版用本機 ── */
async function submit(){
  const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='送出中…';
  const payload=buildPayload();
  try{
    let regId;
    if(state.full==='已滿'){
      regId = await reserveAndSave(payload);       // 有帳位鎖定
    }else{
      regId = await saveOnly(payload);             // 志願，不鎖位
    }
    state.done={id:regId}; currentStep=STEP_DONE; render();
  }catch(e){
    btn.disabled=false; btn.textContent='送出報名';
    if(e && e.code==='FULL'){ toast('抱歉，這頂帳剛剛被選走了，請改選其他帳'); currentStep=STEP_TENT; render(); }
    else{ console.error(e); toast('送出失敗，請稍後再試'); }
  }
}
function buildPayload(){
  const c=state.contact;
  return {
    createdAt: LIVE? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString(),
    contact:c, mates:state.mates, nightRush:state.nightRush, full:state.full,
    tent: state.full==='已滿'? {...state.tent, label:tentLabel(state.tent)} : null,
    wishes: state.full==='未滿'? state.wishes.filter(w=>w.id).map(w=>({...w,label:tentLabel(w)})) : null,
    mergeNote: state.mergeNote||''
  };
}
async function reserveAndSave(payload){
  const id=state.tent.id;
  if(LIVE && db){
    const tref=db.collection('tents').doc(id);
    const rref=db.collection('registrations').doc();
    await db.runTransaction(async tx=>{
      const s=await tx.get(tref);
      const cur=s.exists?(s.data().taken||0):0;
      const total=s.exists?(s.data().total||TENT[id].total):TENT[id].total;
      if(cur>=total){ const err=new Error('full'); err.code='FULL'; throw err; }
      tx.update(tref,{taken:cur+1});
      tx.set(rref,payload);
    });
    return rref.id;
  }else{ // 示範
    loadDemoTaken();
    if(remaining(id)<=0){ const err=new Error('full'); err.code='FULL'; throw err; }
    taken[id]=(taken[id]||0)+1; localStorage.setItem(DEMO_KEY,JSON.stringify(taken));
    return 'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase();
  }
}
async function saveOnly(payload){
  if(LIVE && db){ const r=await db.collection('registrations').add(payload); return r.id; }
  return 'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase();
}

function rDone(){
  const c=state.done||{id:'—'};
  document.getElementById('prog').style.display='none';
  app().innerHTML=`
   <div class="step success">
     <div class="big">🎉⛺️</div>
     <h2>報名完成！</h2>
     <p class="sub">${state.full==='已滿'?'帳位已為你保留。':'主辦將依志願為你排帳，稍後聯繫。'}</p>
     <div class="code">報名編號 ${c.id}</div>
     <p class="hint">確認信／後續通知會寄到 ${esc(state.contact.email)}。<br>如需修改請聯繫主辦。</p>
   </div>`;
}

/* ═══════════ 小工具 ═══════════ */
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function req(id,cond){const el=document.getElementById(id);const e=document.getElementById(id+'_e');
  if(el)el.classList.toggle('bad',!cond); if(e)e.classList.toggle('show',!cond); return cond;}
function radio(name,group,value,label,checked){
  return `<label class="choice ${checked?'sel':''}"><input type="radio" name="${name}" value="${value}" ${checked?'checked':''}>
    <span class="t">${label}</span></label>`;}
function bindChoice(name,cb){
  document.querySelectorAll(`input[name=${name}]`).forEach(r=>r.onchange=()=>{
    cb(r.value); document.querySelectorAll(`input[name=${name}]`).forEach(x=>x.closest('.choice').classList.toggle('sel',x.checked));
  });}
function bindIdWarn(prefix){
  const el=document.getElementById(prefix+'_id'); const w=document.getElementById(prefix+'_id_warn');
  if(!el||!w)return;
  const check=()=>{ const r=twidLooksValid(el.value); w.textContent = r===false?'⚠️ 身分證字號檢查碼不符，請再確認（居留證可忽略）':''; w.style.color='#c0492f'; };
  el.addEventListener('input',check); check();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* stars */
(function(){const s=document.getElementById('stars');for(let i=0;i<26;i++){const st=document.createElement('i');
  const sz=Math.random()*2+1;st.style.width=st.style.height=sz+'px';st.style.left=Math.random()*100+'%';
  st.style.top=Math.random()*70+'%';st.style.opacity=(Math.random()*.6+.3).toFixed(2);s.appendChild(st);}})();

/* mode tag */
document.getElementById('modeTag').innerHTML = LIVE
  ? '正式模式：資料將寫入你的 Firebase。'
  : '目前為 <b>本機示範模式</b>（尚未設定 Firebase）— 可完整試填，帳位數量僅存在這台裝置。';

/* ═══════════ 一次性設定：建立帳位庫存（開檔網址加 #setup-tents） ═══════════ */
function renderSetup(){
  const prog=document.getElementById('prog'); if(prog) prog.style.display='none';
  if(!LIVE||!db){
    app().innerHTML='<div class="step"><h2>尚未接上 Firebase</h2><p class="sub">請先把檔案最上面的 FIREBASE_CONFIG 換成你的設定，再重新開啟本頁。</p></div>';
    return;
  }
  app().innerHTML=`<div class="step">
     <span class="stepno">一次性設定</span>
     <h2>建立帳位庫存</h2>
     <p class="sub">會在 Firestore 建立 11 個帳型、每個 taken 歸 0。<b>報名開始後請勿再按</b>（會把已選走的數量重置）。</p>
     <div id="setupLog" class="notice">尚未執行。</div>
     <button class="btn primary" id="seedBtn" style="margin-top:16px">建立 11 個帳位</button>
   </div>`;
  document.getElementById('seedBtn').onclick=seedTents;
}
async function seedTents(){
  const log=document.getElementById('setupLog'); const btn=document.getElementById('seedBtn');
  btn.disabled=true; log.innerHTML='建立中…';
  const lines=[];
  try{
    for(const t of TENTS){
      await db.collection('tents').doc(t.id).set({name:t.nm, total:t.total, taken:0});
      lines.push(`✔ ${t.nm}（${t.total} 帳）`); log.innerHTML=lines.join('<br>');
    }
    log.innerHTML=lines.join('<br>')+`<br><br><b>✅ 完成！共 ${lines.length} 個帳位。</b>`;
    btn.textContent='已完成'; btn.disabled=true;
  }catch(e){
    console.error(e);
    log.innerHTML='❌ 失敗：'+(e && e.message?e.message:e)+'<br>（可能是安全規則尚未開放 tents 寫入）';
    btn.disabled=false;
  }
}

if(location.hash==='#setup-tents'){ renderSetup(); }
else { watchStock(); render(); }
